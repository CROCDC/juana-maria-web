# Quality gate — must pass before merging to main (set as a required check in the
# repo's branch protection settings).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # The suite drives a real browser against a live server (tests/conftest.py).
      - run: python -m playwright install --with-deps chromium
      - run: python -m mypy
      # `python -m` so the repo root lands on sys.path and `app` imports.
      - run: python -m pytest

  # Only on main: a red PR is part of the workflow, a red main is an incident.
  alert:
    needs: test
    if: failure() && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/alert.yml
    with:
      subject: "🔴 juana-maria-web: CI falló en main"
      body: |
        El quality gate falló en main, así que lo que está por deployarse no pasó los tests.

        Commit: ${{ github.sha }}
        Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
