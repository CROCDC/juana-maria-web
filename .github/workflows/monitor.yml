# Watchdog for the live site: mails ALERT_EMAIL_TO when velaclasica.ar stops working.
#
# It runs here rather than on Vercel because a check that lives inside the deploy
# cannot report that the deploy is down. See docs/deploy/MONITORING.md.
name: Monitor

on:
  schedule:
    # Shallow: is the function serving at all? Cheap — the pages it fetches are
    # served by the CDN and never reach Postgres.
    - cron: "*/15 * * * *"
    # Deep: the only check that touches the database, and therefore the only one that
    # costs anything. Daily, because once the public read path stops querying Postgres
    # (app/snapshot.py) this is one of the few things left that wakes it at all, and a
    # compute stays awake five minutes after each query:
    #
    #   every 15 min  240 h/month  60 CU-hours   60% of the free plan
    #   hourly         60 h/month  15 CU-hours   15%
    #   every 4 h      15 h/month   3.75         ~4%
    #   daily         2.5 h/month   0.6          <1%
    #
    # It earns that much: with the site serving from the snapshot, a dead database is
    # invisible to visitors and breaks only the admin, so this is the one thing that
    # notices before somebody tries to log in.
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: "Include the database round-trip and the Neon quota"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Carries the up/down flag between runs, so an outage mails once instead of
      # every 15 minutes. A fresh key per run with a prefix restore-key is how you
      # get a writable cache entry out of actions/cache.
      - uses: actions/cache@v4
        with:
          path: .monitor-state
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Run checks
        env:
          MONITOR_BASE_URL: https://velaclasica.ar
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          deep=""
          if [ "${{ github.event.schedule }}" = "37 5 * * *" ] || [ "${{ inputs.deep }}" = "true" ]; then
            deep="--deep"
          fi
          python scripts/monitor.py $deep | tee -a "$GITHUB_STEP_SUMMARY"
