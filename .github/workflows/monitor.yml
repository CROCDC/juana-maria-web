# Watchdog for the live site: mails ALERT_EMAIL_TO when velaclasica.ar stops working.
#
# It runs here rather than on Vercel because a check that lives inside the deploy
# cannot report that the deploy is down. See docs/deploy/MONITORING.md.
name: Monitor

# Scheduled runs are OFF. The site's uptime is watched by a separate service, and the
# only check here that touches the database costs CU-hours on a scale-to-zero Postgres
# — the exact resource this repo spent a week learning not to spend. Nothing here is
# free enough to run on a timer for a signal that already arrives another way.
#
# What still watches production, at no cost to the database:
#   - app/alerts.py mails the traceback of any unhandled exception, on real traffic
#   - ci.yml and vercel.yml mail a red CI on main or a failed production deploy
#   - the external uptime service the owner already runs
#
# Run this by hand when you want the deep answer — a real database round-trip and
# Neon's quota — or after an incident:
#
#   gh workflow run monitor.yml -f deep=true
on:
  workflow_dispatch:
    inputs:
      deep:
        description: "Include the database round-trip and the Neon quota"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Carries the up/down flag between runs, so an outage mails once instead of
      # every 15 minutes. A fresh key per run with a prefix restore-key is how you
      # get a writable cache entry out of actions/cache.
      - uses: actions/cache@v4
        with:
          path: .monitor-state
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Run checks
        env:
          MONITOR_BASE_URL: https://velaclasica.ar
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          deep=""
          if [ "${{ inputs.deep }}" = "true" ]; then
            deep="--deep"
          fi
          python scripts/monitor.py $deep | tee -a "$GITHUB_STEP_SUMMARY"
