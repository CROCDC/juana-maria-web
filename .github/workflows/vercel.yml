# Vercel deploy: PR -> Preview, main -> Production.
#
# Inert until enabled: set the repo variable DEPLOY_ENABLED=true and the secrets
# VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID / MIGRATIONS_DATABASE_URL. Turn OFF Vercel's
# own Git integration for the project so deploys happen only from here.
name: Vercel

on:
  push:
    branches: [main]
  pull_request:
  # Fired by the app when an admin publishes: the content the public sees ships inside
  # the bundle (app/snapshot.py), so publishing it means deploying it.
  repository_dispatch:
    types: [content-published]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: >-
          Deploy without running `flask db upgrade`. For shipping a change that
          touches no schema while the database is unreachable — a suspended Neon
          compute fails the migration step and blocks a deploy that would otherwise
          have brought the site back. Only use it when the diff adds no migration.
        type: boolean
        default: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No `cache: pip` here, unlike ci.yml: pip only runs in the migrations step,
      # which is skipped on a PR — and setup-python's post-run step now FAILS the job
      # when it finds no ~/.cache/pip to save, turning every green preview red.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Migrations run here, not in the app: a Vercel Function has no startup hook
      # to hang `flask db upgrade` on the way docker-entrypoint.sh does. Production
      # only — a preview build shares the production database, so migrating from a
      # PR would move the live schema ahead of the live code.
      #
      # MIGRATIONS_DATABASE_URL is Neon's UNPOOLED endpoint: DDL wants a real session,
      # which the pooler (PgBouncer, transaction mode) does not guarantee. The app
      # itself keeps using the pooled DATABASE_URL from the project's environment.
      - name: Apply database migrations
        if: >-
          github.event_name != 'pull_request'
          && inputs.skip_migrations != true
        env:
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
          FLASK_APP: wsgi.py
        run: |
          pip install -r requirements.txt
          python -m flask db upgrade

      # The content the public sees ships as a file inside the bundle, so a page view
      # costs no database query and no quota (app/snapshot.py). It is generated here,
      # from the database the migrations just ran against, and picked up by the deploy
      # below because `vercel deploy` uploads the working directory.
      - name: Build the content snapshot
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
          FLASK_APP: wsgi.py
        run: |
          pip install -r requirements.txt
          python -m flask snapshot build

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Vercel builds server-side (not --prebuilt) so the project's own environment
      # variables are present at build time.
      - name: Deploy production
        if: github.event_name != 'pull_request'
        run: |
          url=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to production: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: |
          url=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  # A failed production deploy leaves the previous one serving, so the site stays up
  # and nothing about it is visible from outside — hence the mail.
  alert:
    needs: deploy
    if: failure() && github.event_name != 'pull_request'
    uses: ./.github/workflows/alert.yml
    with:
      subject: "🔴 juana-maria-web: el deploy a producción falló"
      body: |
        Falló el deploy a producción (migraciones o el deploy en sí). Producción sigue
        sirviendo el deployment anterior.

        Commit: ${{ github.sha }}
        Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
